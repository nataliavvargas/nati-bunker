<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nati Bunker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo h1 {
      font-size: 32px;
      letter-spacing: -1px;
    }

    .logo p {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #000EFF;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0 24px;
      font-size: 14px;
      color: #555;
    }

    .remember input {
      width: 17px;
      height: 17px;
      accent-color: #000EFF;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #000EFF;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <h1>Nati Bunker</h1>
      <p>La matriz</p>
    </div>

    <form>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="tu@email.com"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
        >
      </div>

      <label class="remember">
        <input type="checkbox">
        Recordarme
      </label>

      <button type="submit" class="login-button">
        Entrar
      </button>
    </form>

    <div class="footer">
      Nati Bunker · Sistema personal
    </div>

  </div>

</body>
</html>
