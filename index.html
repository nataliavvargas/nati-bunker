<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nati Bunker — La Matriz</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="brand">
        <h1>Nati Bunker</h1>
        <p>La Matriz</p>
      </div>

      <button class="menu">
        ☰
      </button>

    </header>


    <!-- BALANCE -->

    <section class="balance-card">

      <div class="balance-title">

        <span>💰 DISPONIBLE</span>

        <button
          class="eye"
          onclick="toggleBalance()"
          id="eyeButton"
        >
          👁
        </button>

      </div>

      <div
        class="balance"
        id="balance"
      >
        $ 1.234.567
      </div>

    </section>


    <!-- QUICK ACTIONS -->

    <h2 class="section-title">
      ⚡ ACCIONES RÁPIDAS
    </h2>

    <section class="quick-actions">

      <button class="quick-button">

        <div class="quick-icon">
          🍫
        </div>

        <div class="quick-title">
          Gasto rápido
        </div>

        <div class="quick-description">
          Kiosco, café, gustitos...
        </div>

      </button>


      <button class="quick-button">

        <div class="quick-icon">
          🛒
        </div>

        <div class="quick-title">
          Supermercado
        </div>

        <div class="quick-description">
          Stock y lista de compras
        </div>

      </button>


      <button class="quick-button">

        <div class="quick-icon">
          🧾
        </div>

        <div class="quick-title">
          Pagar cuenta
        </div>

        <div class="quick-description">
          Luz, gas, internet...
        </div>

      </button>


      <button class="quick-button">

        <div class="quick-icon">
          💰
        </div>

        <div class="quick-title">
          Separar plata
        </div>

        <div class="quick-description">
          Ahorros y objetivos
        </div>

      </button>

    </section>


    <!-- TODO -->

    <h2 class="section-title">
      🔔 PARA HACER
    </h2>

    <section class="todo">

      <div class="todo-item">

        <div class="todo-left">

          <span class="todo-icon">
            🛒
          </span>

          <span class="todo-text">
            3 productos para comprar
          </span>

        </div>

        <span class="arrow">
          ›
        </span>

      </div>


      <div class="todo-item">

        <div class="todo-left">

          <span class="todo-icon">
            🧾
          </span>

          <span class="todo-text">
            2 cuentas pendientes
          </span>

        </div>

        <span class="arrow">
          ›
        </span>

      </div>

    </section>

  </main>


  <script>
<script src="app.js"></script>
   
  </script>

</body>
</html>
