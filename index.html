<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nati Bunker — La Matriz</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="brand">
        <h1>Nati Bunker</h1>
        <p>La Matriz</p>
      </div>

      <button
        class="menu"
        onclick="document.getElementById('sideMenu').classList.add('open')"
      >
        ☰
      </button>

    </header>


    <!-- MENU -->

    <aside class="side-menu" id="sideMenu">

      <div class="side-menu-header">

        <strong>LA MATRIZ</strong>

        <button
          class="close-menu"
          onclick="document.getElementById('sideMenu').classList.remove('open')"
        >
          ×
        </button>

      </div>


      <nav class="menu-options">

        <button>
          🏠 Inicio
        </button>

        <button
          onclick="openStock()"
        >
          📦 Stock
        </button>

        <button>
          🛒 Lista de compras
        </button>

        <button>
          💸 Gastos
        </button>

        <button>
          🧾 Cuentas
        </button>

        <button>
          💵 Ingresos
        </button>

      </nav>

    </aside>


    <!-- STOCK -->

    <section
      class="stock-screen"
      id="stockScreen"
    >

      <div class="stock-header">

        <button
          class="back-button"
          onclick="closeStock()"
        >
          ←
        </button>

        <div>

          <h2>📦 Stock</h2>

          <p>
            Lo que hay en casa
          </p>

        </div>

      </div>


      <!-- BUSCADOR -->

      <div class="stock-search">

        <span>
          🔎
        </span>

        <input
          type="text"
          id="stockSearch"
          placeholder="Buscar producto..."
        >

        <button
          class="add-product"
          onclick="openAddProduct()"
        >
          ＋
        </button>

      </div>


      <!-- CATEGORÍAS -->

      <div class="stock-categories">

        <button class="stock-category">
          <span>🧴 Aseo / Botiquín</span>
          <span>›</span>
        </button>

        <button class="stock-category">
          <span>🧹 Limpieza</span>
          <span>›</span>
        </button>

       <button
  class="stock-category"
  onclick="openCategory('abarrotes')"
>
  <span>🍔 Abarrotes</span>
  <span>›</span>
</button>

        <button class="stock-category">
          <span>🧂 Condimentos</span>
          <span>›</span>
        </button>

        <button class="stock-category">
          <span>🍝 Pastas</span>
          <span>›</span>
        </button>

        <button class="stock-category">
          <span>🥛 Lácteos</span>
          <span>›</span>
        </button>

        <button class="stock-category">
          <span>🥩 Carne</span>
          <span>›</span>
        </button>

        <button class="stock-category">
          <span>🥤 Bebidas</span>
          <span>›</span>
        </button>

        <button class="stock-category">
          <span>🥦 Verduras</span>
          <span>›</span>
        </button>

      </div>

    </section>
<!-- CATEGORÍA: ABARROTES -->

<section
  class="category-screen"
  id="abarrotesScreen"
>

  <div class="stock-header">

    <button
      class="back-button"
      onclick="closeCategory()"
    >
      ←
    </button>

    <div>

      <h2>🍔 Abarrotes</h2>

      <p>
        Despensa
      </p>

    </div>

  </div>


  <!-- BUSCADOR -->

  <div class="stock-search">

    <span>
      🔎
    </span>

    <input
      type="text"
      placeholder="Buscar producto..."
    >

    <button
      class="add-product"
      onclick="openAddProduct()"
    >
      ＋
    </button>

  </div>


  <!-- PRODUCTOS -->

  <div class="product-list">

    <button class="product-item">

      <div class="product-info">

        <strong>
          Atún
        </strong>

        <span>
          3 latas
        </span>

      </div>

    </button>


    <button class="product-item">

      <div class="product-info">

        <strong>
          Arroz
        </strong>

        <span>
          2 unidades
        </span>

      </div>

    </button>


    <button class="product-item">

      <div class="product-info">

        <strong>
          Aceite
        </strong>

        <span>
          3 unidades
        </span>

      </div>

    </button>


    <button class="product-item">

      <div class="product-info">

        <strong>
          Harina
        </strong>

        <span>
          1 unidad
        </span>

      </div>

    </button>

  </div>

</section>

    <!-- BALANCE -->

    <section class="balance-card">

      <input
        type="checkbox"
        id="balanceToggle"
        class="balance-toggle"
      >

      <div class="balance-title">

        <span>
          💰 DISPONIBLE
        </span>

        <label
          for="balanceToggle"
          class="eye"
        >
          👁
        </label>

      </div>

      <div class="balance">
        $ 1.234.567
      </div>

    </section>


    <!-- QUICK ACTIONS -->

    <h2 class="section-title">
      ⚡ ACCIONES RÁPIDAS
    </h2>

    <section class="quick-actions">

      <button class="quick-button">

        <div class="quick-icon">
          🍫
        </div>

        <div class="quick-title">
          Gasto rápido
        </div>

        <div class="quick-description">
          Kiosco, café, gustitos...
        </div>

      </button>


      <button class="quick-button">

        <div class="quick-icon">
          🛒
        </div>

        <div class="quick-title">
          Supermercado
        </div>

        <div class="quick-description">
          Stock y lista de compras
        </div>

      </button>


      <button class="quick-button">

        <div class="quick-icon">
          🧾
        </div>

        <div class="quick-title">
          Pagar cuenta
        </div>

        <div class="quick-description">
          Luz, gas, internet...
        </div>

      </button>


      <button class="quick-button">

        <div class="quick-icon">
          💵
        </div>

        <div class="quick-title">
          Ingreso
        </div>

        <div class="quick-description">
          Sueldo y otros ingresos
        </div>

      </button>

    </section>


    <!-- TODO -->

    <h2 class="section-title">
      🔔 PARA HACER
    </h2>

    <section class="todo">

      <div class="todo-item">

        <div class="todo-left">

          <span class="todo-icon">
            🛒
          </span>

          <span class="todo-text">
            3 productos para comprar
          </span>

        </div>

        <span class="arrow">
          ›
        </span>

      </div>


      <div class="todo-item">

        <div class="todo-left">

          <span class="todo-icon">
            🧾
          </span>

          <span class="todo-text">
            2 cuentas pendientes
          </span>

        </div>

        <span class="arrow">
          ›
        </span>

      </div>

    </section>

  </main>


  <!-- JAVASCRIPT -->

  <script src="app.js"></script>


  <!-- STOCK FUNCTIONS -->

  <script>

    function openStock() {

      document.querySelector(".stock-screen").style.display = "block";
      document.querySelector(".category-screen").style.display = "none";

      document.querySelector(".balance-card").style.display = "none";

      document.querySelectorAll(".section-title").forEach(function(element) {
        element.style.display = "none";
      });

      document.querySelector(".quick-actions").style.display = "none";
      document.querySelector(".todo").style.display = "none";

      document.getElementById("sideMenu").classList.remove("open");

    }


    function closeStock() {

      document.querySelector(".stock-screen").style.display = "none";
      document.querySelector(".category-screen").style.display = "none";

      document.querySelector(".balance-card").style.display = "";

      document.querySelectorAll(".section-title").forEach(function(element) {
        element.style.display = "";
      });

      document.querySelector(".quick-actions").style.display = "";
      document.querySelector(".todo").style.display = "";

    }


    function openCategory(category) {

      if (category === "abarrotes") {

        document.querySelector(".stock-screen").style.display = "none";

        document.getElementById("abarrotesScreen").style.display = "block";

      }

    }


    function closeCategory() {

      document.getElementById("abarrotesScreen").style.display = "none";

      document.querySelector(".stock-screen").style.display = "block";

    }


    function openAddProduct() {

      alert("Próximamente: agregar producto");

    }

  </script>


</body>

</html>
